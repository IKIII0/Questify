name: questify
description: "Aplikasi kuis pilihan ganda interaktif dengan tema editorial modern, mendukung input nama pengguna, skor dinamis, preservasi state saat rotasi layar, serta mode gelap dan terang."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
